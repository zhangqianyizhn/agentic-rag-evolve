[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag-evolve"
version = "0.1.0"
description = "Trace-guided evolution framework for DeepRead and RAG agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.2",
    "requests>=2.32.5",
    "tiktoken>=0.12.0",
    "volcengine-python-sdk>=5.0.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag_evolve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
